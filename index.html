<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>28.10.26</title>
    <style>
      body {
        background-color: white;
      }
      #filters{
        margin-top:8px;
        display: flex;
        gap:8px
      }
      .buy-btn {
        background-color: lightgreen;
        border: none;
        padding: 4px 8px;
        margin-left: 8px;
      }
      #product-list{
        display: grid;
        grid-row: auto;
        grid-template-columns:auto auto;
        gap:16px;
      }
      .product-item {
        margin: 8px;
        display: flex;
        flex-direction: column;
        
      }
      .cart-item {
        margin: 8px;
      }
      .cart-item > button {
        background-color: lightcoral;
        color: white;
        margin-left: 8px;
        padding: 4px 8px;
        border: none;
      }
      .error{
        color:red;
      }
    </style>
  </head>
  <body>
    <div id="app">

      <!-- Sekcja sterowania -->
      <header>
        <input type="text" id="search-input" placeholder="Szukaj produktu..." />
        <button id="search-btn">Szukaj</button>

        <div id="filters">
          <button class="filter-btn" id="btn-all">Wszystko</button>
          <button class="filter-btn" data-category="Elektronika">IT</button>
          <button class="filter-btn" data-category="Spozywcze">Jedzenie</button>
        </div>
      </header>

      <main style="display: flex; gap: 40px; margin-top: 20px">
        <!-- Lista produktów -->
        <div id="shop" style="flex: 2">
          <h2>Produkty</h2>
          <div id="status-message"></div>

          <div id="product-list"></div>
        </div>
        <!-- Koszyk -->
        <div
          id="cart-section"
          style="flex: 1; border-left: 2px solid #ccc; padding-left: 20px"
        >
          <h2>Koszyk</h2>
          <div id="cart-list"></div>
          <btn
            id="clear-cart-btn"
            style="
              background-color: red;
              color: white;
              border: none;
              padding: 4px 8px;
              font-weight: 700;
            "
            >Wyczysc kosz</btn
          >

          <div id="discount-box" style="padding-top: 16px">
            <input type="text" id="discount-input" placeholder="Kod rabatowy" />
            <button id="discount-btn">Zastosuj</button>
            <p id="discount-message"></p>
          </div>
          <p>Rabat: <span id="cart-discount">0</span> PLN</p>
          <h3>Do zapłaty: <span id="cart-total">0</span> PLN</h3>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
